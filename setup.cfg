[tool:pytest]
addopts= --tb native -n4 -v -r fxX --maxfail=10 -p no:warnings
python_files=test/*test_*.py
;python_functions=test_autoincrement_col
;python_functions=test_reflect_comments
;python_functions=test_get_multi_columns
;python_functions=test_delete_scalar_subq_round_trip

[sqla_testing]
requirement_cls=sqlalchemy_starrocks.requirements:Requirements
profile_file=.profiles.txt

[db]
default=starrocks://root@localhost:9030/test_sqla

[aliases]
test=pytest
;
;[flake8]
;show-source = true
;enable-extensions = G
;# E203 is due to https://github.com/PyCQA/pycodestyle/issues/373
;ignore =
;    A003,
;    D,
;    E203,E305,E711,E712,E721,E722,E741,
;    N801,N802,N806,
;    RST304,RST303,RST299,RST399,
;    W503,W504
;exclude = .venv,.git,.tox,dist,doc,*egg,build
;import-order-style = google
;application-import-names = starrocks